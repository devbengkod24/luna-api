<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat dengan TTS & STT</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 800px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        height: 90vh;
        max-height: 800px;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 12px 12px 0 0;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f8f9fa;
      }

      .message {
        margin-bottom: 15px;
        display: flex;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message.assistant {
        justify-content: flex-start;
      }

      .message.system {
        justify-content: center;
      }

      .message-content {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 12px;
        word-wrap: break-word;
      }

      .message.user .message-content {
        background: #667eea;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.assistant .message-content {
        background: #e9ecef;
        color: #333;
        border-bottom-left-radius: 4px;
      }

      .message.system .message-content {
        background: #fff3cd;
        color: #856404;
        font-size: 13px;
        max-width: 90%;
      }

      .controls {
        padding: 20px;
        background: white;
        border-top: 1px solid #e9ecef;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-record {
        background: #dc3545;
        color: white;
      }

      .btn-record:hover:not(:disabled) {
        background: #c82333;
        transform: scale(1.05);
      }

      .btn-record:disabled {
        background: #6c757d;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .btn-stop {
        background: #ffc107;
        color: black;
      }

      .btn-stop:hover:not(:disabled) {
        background: #e0a800;
      }

      .btn-stop:disabled {
        background: #6c757d;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .btn-clear {
        background: #6c757d;
        color: white;
      }

      .btn-clear:hover {
        background: #5a6268;
      }

      .status {
        padding: 8px 16px;
        background: #e7f3ff;
        border-left: 4px solid #667eea;
        border-radius: 4px;
        font-size: 13px;
        color: #0066cc;
        min-width: 200px;
      }

      .status.recording {
        background: #ffe7e7;
        border-left-color: #dc3545;
        color: #dc3545;
      }

      .status.processing {
        background: #fff3cd;
        border-left-color: #ffc107;
        color: #856404;
      }

      .status.error {
        background: #f8d7da;
        border-left-color: #dc3545;
        color: #721c24;
      }

      .mic-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        background: #dc3545;
        border-radius: 50%;
        animation: pulse 0.6s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.2);
        }
      }

      .input-group {
        display: flex;
        gap: 10px;
        width: 100%;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #667eea;
      }

      .btn-send {
        background: #28a745;
        color: white;
        padding: 12px 20px;
      }

      .btn-send:hover:not(:disabled) {
        background: #218838;
      }

      .btn-send:disabled {
        background: #6c757d;
        cursor: not-allowed;
        opacity: 0.6;
      }

      .settings {
        padding: 10px 20px;
        background: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        font-size: 13px;
        display: flex;
        gap: 20px;
        align-items: center;
        flex-wrap: wrap;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      input[type="checkbox"] {
        cursor: pointer;
      }

      .character-select {
        padding: 6px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 13px;
        background: white;
      }

      @media (max-width: 600px) {
        .message-content {
          max-width: 85%;
        }

        button {
          padding: 10px 16px;
          font-size: 12px;
        }

        .controls {
          flex-direction: column;
          gap: 8px;
        }

        .input-group {
          flex-direction: column;
        }

        .status {
          min-width: auto;
          width: 100%;
        }
      }

      .loading-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #667eea;
        border-radius: 50%;
        margin: 0 3px;
        animation: typing 1.4s infinite;
      }

      .loading-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loading-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          opacity: 0.3;
        }
        30% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎤 Chat dengan AI</h1>
        <p>Gunakan audio atau text untuk berkomunikasi</p>
      </div>

      <div class="settings">
        <select id="characterSelect" class="character-select">
          <option value="russell">Karakter: Russell</option>
          <option value="fredricksen">Karakter: Fredricksen</option>
        </select>
        <label>
          <input type="checkbox" id="enableTTS" checked />
          Enable TTS (Output Audio)
        </label>
        <label>
          API:
          <input
            type="text"
            id="apiUrl"
            value="http://localhost:8000"
            style="width: 150px; padding: 6px"
          />
        </label>
      </div>

      <div id="messages" class="messages">
        <div class="message system">
          <div class="message-content">
            👋 Selamat datang! Klik tombol mikrofon atau ketik pesan untuk
            memulai.
          </div>
        </div>
      </div>

      <div class="controls">
        <button id="recordBtn" class="btn-record" onclick="startRecording()">
          🎤 Mulai Rekam
        </button>
        <button
          id="stopBtn"
          class="btn-stop"
          onclick="stopRecording()"
          disabled
        >
          ⏹️ Berhenti
        </button>
        <div id="status" class="status">Siap</div>
      </div>

      <div class="controls">
        <div class="input-group">
          <input
            type="text"
            id="textInput"
            placeholder="Atau ketik pesan dan tekan Enter..."
            onkeypress="handleKeyPress(event)"
          />
          <button id="sendBtn" class="btn-send" onclick="sendText()">
            Kirim
          </button>
        </div>
      </div>

      <div class="controls">
        <button class="btn-clear" onclick="clearMessages()">
          🗑️ Hapus Chat
        </button>
      </div>
    </div>

    <script>
      const API_URL = document.getElementById("apiUrl");
      const recordBtn = document.getElementById("recordBtn");
      const stopBtn = document.getElementById("stopBtn");
      const status = document.getElementById("status");
      const messagesDiv = document.getElementById("messages");
      const characterSelect = document.getElementById("characterSelect");
      const enableTTSCheckbox = document.getElementById("enableTTS");
      const textInput = document.getElementById("textInput");
      const sendBtn = document.getElementById("sendBtn");

      let mediaRecorder;
      let audioChunks = [];
      let sessionUUID = null;

      async function startRecording() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
          };

          mediaRecorder.onstop = async () => {
            setStatus("Memproses audio...", "processing");
            const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
            const audioBase64 = await blobToBase64(audioBlob);
            await sendAudioChat(audioBase64);
          };

          mediaRecorder.start();
          recordBtn.disabled = true;
          stopBtn.disabled = false;
          setStatus("🔴 Sedang Merekam...", "recording");
        } catch (error) {
          setStatus("❌ Tidak bisa akses mikrofon: " + error.message, "error");
        }
      }

      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
          recordBtn.disabled = false;
          stopBtn.disabled = true;
          setStatus("Merekam selesai. Mengirim...", "processing");
        }
      }

      function blobToBase64(blob) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64 = reader.result.split(",")[1];
            resolve(base64);
          };
          reader.readAsDataURL(blob);
        });
      }

      async function sendAudioChat(audioBase64) {
        try {
          const request = {
            uuid: sessionUUID,
            audio: audioBase64,
            character: characterSelect.value,
            context: {
              emotion: "happy",
              name: "User",
              nim: null,
            },
            enable_tts: enableTTSCheckbox.checked,
          };

          setStatus("⏳ Mengirim ke server...", "processing");

          const response = await fetch(`${API_URL.value}/v1/chat/audio`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(request),
          });

          if (!response.ok) {
            const error = await response.json();
            setStatus(`❌ Error: ${error.detail || "Unknown error"}`, "error");
            return;
          }

          setStatus("📡 Menerima respons...", "processing");
          await handleStreamingResponse(response);
        } catch (error) {
          setStatus(`❌ Error: ${error.message}`, "error");
          console.error("Error:", error);
        }
      }

      async function sendText() {
        const prompt = textInput.value.trim();
        if (!prompt) return;

        addMessage("user", prompt);
        textInput.value = "";

        try {
          const request = {
            uuid: sessionUUID,
            prompt: prompt,
            character: characterSelect.value,
            context: {
              emotion: "happy",
              name: "User",
              nim: null,
            },
          };

          setStatus("⏳ Mengirim...", "processing");

          const response = await fetch(`${API_URL.value}/v1/chat/text`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(request),
          });

          if (!response.ok) {
            const error = await response.json();
            setStatus(`❌ Error: ${error.detail}`, "error");
            return;
          }

          setStatus("📡 Menerima respons...", "processing");
          await handleStreamingResponse(response);
        } catch (error) {
          setStatus(`❌ Error: ${error.message}`, "error");
          console.error("Error:", error);
        }
      }

      async function handleStreamingResponse(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let assistantMessage = "";

        try {
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");

            for (let i = 0; i < lines.length - 1; i++) {
              const line = lines[i].trim();
              if (line.startsWith("data: ")) {
                try {
                  const event = JSON.parse(line.slice(6));
                  handleChatEvent(event, (msg) => {
                    assistantMessage += msg;
                  });
                } catch (e) {
                  console.error("Parse error:", e);
                }
              }
            }

            buffer = lines[lines.length - 1];
          }

          if (assistantMessage) {
            addMessage("assistant", assistantMessage);
          }
        } catch (error) {
          setStatus(`❌ Stream error: ${error.message}`, "error");
          console.error("Stream error:", error);
        }
      }

      function handleChatEvent(event, onToken) {
        console.log("Event:", event);

        switch (event.type) {
          case "log":
            setStatus(event.content, "processing");
            break;

          case "transcript":
            addMessage("user", event.content);
            setStatus("📝 STT: " + event.content, "processing");
            break;

          case "token":
            if (onToken) onToken(event.content);
            break;

          case "audio":
            playAudio(event.content);
            setStatus("🔊 Memutar audio respons...", "processing");
            break;

          case "done":
            setStatus("✅ Selesai (" + event.finish_reason + ")", "");
            break;

          case "error":
            setStatus("❌ Error: " + event.content, "error");
            break;
        }
      }

      function playAudio(audioBase64) {
        try {
          const audio = new Audio(`data:audio/wav;base64,${audioBase64}`);
          audio.play().catch((e) => console.error("Playback error:", e));
        } catch (error) {
          console.error("Audio error:", error);
        }
      }

      function addMessage(role, content) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${role}`;
        messageDiv.innerHTML = `<div class="message-content">${escapeHtml(
          content
        )}</div>`;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function setStatus(message, className = "") {
        status.textContent = message;
        status.className = "status " + className;
      }

      function clearMessages() {
        messagesDiv.innerHTML =
          '<div class="message system"><div class="message-content">👋 Chat dibersihkan. Mulai percakapan baru!</div></div>';
        sessionUUID = null;
      }

      function handleKeyPress(event) {
        if (event.key === "Enter") {
          sendText();
        }
      }

      function escapeHtml(text) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };
        return text.replace(/[&<>"']/g, (m) => map[m]);
      }

      // Initialize
      setStatus("Siap 👍");
    </script>
  </body>
</html>
