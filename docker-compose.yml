name: luna
services:
  ollama:
    image: ollama/ollama:0.13.1-rc0
    container_name: ollama
    # ports:
    # - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - fastapi

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: luna_db
      POSTGRES_USER: bengkod
      POSTGRES_PASSWORD: luna_kece
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bengkod", "-d", "luna_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: qdrant
    ports:
      - "6333:6333"
      # - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # environment:
    #   QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    networks:
      - fastapi

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - fastapi

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_DB: luna_db
      POSTGRES_USER: bengkod
      POSTGRES_PASSWORD: luna_kece

      # Qdrant
      QDRANT_HOST: qdrant

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

      # GPU (-1 CPU, 0+ GPU)
      GPU_DEVICE: -1

      # Ollama / LLM — latency experiment: minimize gpt-oss thinking.
      # "low" | "medium" | "high"; unset/blank = model default. Revert by
      # removing this line (or setting it back to medium).
      OLLAMA_REASONING_EFFORT: low

      # Agent tools: rag_search (Udinus KB) + search_web (Exa, current/external info).
      EXA_API_KEY: "16aa6c02-58c2-4e8c-af32-01cb3157555b"
      WEB_SEARCH_COUNT: 3
      EXA_FETCH_TEXT: "false"             # false=highlights+bounded text (fast); true=full text
      # EXA_LIVECRAWL: fallback           # freshness vs latency (cached by default)
      # EXA_INCLUDE_DOMAINS: dinus.ac.id  # pins scope="general" too — normally leave empty
      RAG_TOP_K: 3

      # Domains the scope="campus" branch of search_web is pinned to. Keeps
      # campus answers on official sites even when the model rewrites the query
      # into English (unpinned, that returns LinkedIn profiles of other
      # universities' rectors). Subdomains match automatically.
      EXA_CAMPUS_DOMAINS: dinus.ac.id

      # OFF while the Qdrant KB is empty: rag_search would always return
      # "nothing found", costing a full extra LLM round-trip (~1.6s) before the
      # model falls back to search_web. This also swaps the prompt's tool policy
      # to the web-first variant (src/prompts/tool-policy-web.txt).
      # Set back to "true" after seeding: python -m src.seeder rag
      ENABLE_RAG_TOOL: true

      # Face Recognition (OpenCV: YuNet detection + SFace embedding)
      ENABLE_FACE_RECOGNITION: true
      # SFace, the same model the kiosk embeds with. Both halves must agree:
      # 128 against a 512 index is not a weak match, it is no comparison at all.
      FACE_EMBEDDING_DIM: 128
      ENABLE_TTS: true

      TTS_PROVIDER: cartesia
      # Comma-separated for failover: keys are used in order, and the next one
      # takes over when Cartesia reports the current key out of credits.
      CARTESIA_API_KEY: sk_car_rsMdvvtEFz4zvuvEmgqGdz, sk_car_LBvVBZyEYFfexyjJWmEHmp, sk_car_yGEmU1nYfLTcrJfpHVuJa9, sk_car_hVT1eVfPjxfyRSNfuWyvRo, sk_car_qrgbsUjD3h2JzL4tLsGAg1, sk_car_g9Age19Tug61jW1u4Du7pD
      CARTESIA_VOICE_ID: b441c4fd-4910-4c55-ae56-f0291057e2cc

      # Speech / TTS
      # whisper (local) | deepgram (cloud REST, Silero still does turn detection)
      # | deepgram-stream (cloud WebSocket, Deepgram does turn detection too —
      # no local VAD runs at all). Falls back to Whisper at startup if the key is
      # missing or the SDK fails to load.
      STT_PROVIDER: deepgram-stream
      DEEPGRAM_API_KEY: 61a8f8173e65207d3ab9b48a5adc7a93efece451
      DEEPGRAM_MODEL: nova-3
      DEEPGRAM_LANGUAGE: id
      # Streaming turn detection. These replace VOICE_SPEECH_END_FRAMES on the
      # deepgram-stream path. Deepgram's own endpointing default is 10ms, which
      # is far too twitchy for a kiosk.
      DEEPGRAM_ENDPOINTING_MS: 600
      DEEPGRAM_UTTERANCE_END_MS: 1200
      # Off because the kiosk interrupts itself: with no local VAD, TTS leaking
      # back through the mic reads as the user starting to speak, and browser
      # echo cancellation does not survive a speaker at conversational volume.
      # Audio heard mid-reply is dropped instead of answered. Turn on only with
      # a headset, where the mic genuinely cannot hear the output.
      DEEPGRAM_STREAM_BARGE_IN: false
      # nova-3 keyterm prompting for campus vocabulary, comma-separated.
      DEEPGRAM_KEYTERM: "Udinus"
      WHISPER_MODEL: large-v3

    volumes:
      # - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./storage:/app/storage
      - ai_cache:/root/.cache
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn src.drivers.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - fastapi

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_models:
    driver: local
  ai_cache:
    driver: local
  minio_data:
    driver: local

networks:
  fastapi:
    driver: bridge
