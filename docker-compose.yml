name: vsa
services:
  ollama:
    image: ollama/ollama:0.13.1-rc0
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # OLLAMA_MODEL: ${LLM_MODEL}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - fastapi

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    # healthcheck:
    #   test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    restart: unless-stopped
    networks:
      - fastapi

  fastapi:
    build:
      context: .
      # Default: Dockerfile.cpu (CPU)
      # For GPU: use docker-compose -f docker-compose.yml -f docker-compose.gpu.yml
      dockerfile: Dockerfile.cpu
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      # Application
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}

      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: 6334
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}

      # Ollama
      OLLAMA_HOST: ollama
      OLLAMA_PORT: 11434

      # Face Recognition
      ENABLE_FACE_RECOGNITION: ${ENABLE_FACE_RECOGNITION}
      FACE_RECOGNITION_MODEL: ${FACE_RECOGNITION_MODEL}
      FACE_RECOGNITION_CTX_ID: ${FACE_RECOGNITION_CTX_ID}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD}

    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./storage:/app/storage
      - ai_cache:/root/.cache
      # - .:/app

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    command: uvicorn src.drivers.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - fastapi
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_models:
    driver: local
  ai_cache:
    driver: local

networks:
  fastapi:
    driver: bridge
