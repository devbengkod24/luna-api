name: luna
services:
  ollama:
    image: ollama/ollama:0.13.1-rc0
    container_name: ollama
    # ports:
    # - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - fastapi

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: luna_db
      POSTGRES_USER: bengkod
      POSTGRES_PASSWORD: luna_kece
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bengkod", "-d", "luna_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: qdrant
    ports:
      - "6333:6333"
      # - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # environment:
    #   QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    networks:
      - fastapi

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - fastapi

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_DB: luna_db
      POSTGRES_USER: bengkod
      POSTGRES_PASSWORD: luna_kece

      # Qdrant
      QDRANT_HOST: qdrant

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

      # GPU (-1 CPU, 0+ GPU)
      GPU_DEVICE: -1

      # Ollama / LLM — latency experiment: minimize gpt-oss thinking.
      # "low" | "medium" | "high"; unset/blank = model default. Revert by
      # removing this line (or setting it back to medium).
      OLLAMA_REASONING_EFFORT: low

      # Agent tools: rag_search (Udinus KB) + search_web (Exa, current/external info).
      EXA_API_KEY: "16aa6c02-58c2-4e8c-af32-01cb3157555b"
      WEB_SEARCH_COUNT: 3
      EXA_FETCH_TEXT: "false"             # false=highlights+bounded text (fast); true=full text
      # EXA_LIVECRAWL: fallback           # freshness vs latency (cached by default)
      # EXA_INCLUDE_DOMAINS: dinus.ac.id  # pins scope="general" too — normally leave empty
      RAG_TOP_K: 3

      # Domains the scope="campus" branch of search_web is pinned to. Keeps
      # campus answers on official sites even when the model rewrites the query
      # into English (unpinned, that returns LinkedIn profiles of other
      # universities' rectors). Subdomains match automatically.
      EXA_CAMPUS_DOMAINS: dinus.ac.id

      # OFF while the Qdrant KB is empty: rag_search would always return
      # "nothing found", costing a full extra LLM round-trip (~1.6s) before the
      # model falls back to search_web. This also swaps the prompt's tool policy
      # to the web-first variant (src/prompts/tool-policy-web.txt).
      # Set back to "true" after seeding: python -m src.seeder rag
      ENABLE_RAG_TOOL: "false"

      # Face Recognition (InsightFace)
      ENABLE_FACE_RECOGNITION: true
      ENABLE_EMOTION_DETECTION: true

      # Emotion: EmotiEffLib, AffectNet-trained EfficientNet-B2, 7 classes.
      # Weights are baked into the image — changing this to another name from
      # get_model_list() means rebuilding, or it downloads at first use.
      EMOTIEFFLIB_MODEL: enet_b2_7
      ENABLE_TTS: true
      FACE_RECOGNITION_CTX_ID: -1 # -1 CPU, 0+ GPU
      
      # Device-Directed Speech Detection (LR-ASD active-speaker fusion).
      # When false the directedness gate fails open on the audio-visual dimension
      # and degrades to a facing-only check. Needs the ONNX models at
      # storage/models/asd/ (audio_frontend / visual_frontend / av_backend).
      ENABLE_ASD: false
      # Tuning knobs — calibrate from the `directedness:` INFO log, not by guess.
      # FACING_THRESHOLD is provisional; see src/config.py for what the score means.
      FACING_THRESHOLD: 0.35
      ASD_SCORE_THRESHOLD: 0.5
      ASD_PRESENCE_RATIO: 0.35

      # Barge-in — talking over Luna cancels the reply.
      # "vad" = just start talking; "hotword" = only "stop"/"berhenti" + button.
      # Calibrate from the `barge-in accepted/rejected` INFO logs on the real
      # kiosk. Switch the mode to "hotword" if the acoustics turn out hopeless.
      #
      # Barge-in fires when RATIO of the last WINDOW_FRAMES were speech (15 x
      # 30 ms = 450 ms of context, 60% => 9 frames). A sliding ratio, not a
      # consecutive run: human speech has micro-gaps and echo cancellers drop
      # the near-end talker in bursts during double-talk, so an unbroken streak
      # almost never happened.
      #
      # Tune from the `barge-in watch: peak N/M` log emitted after every reply:
      #   peak just under M   -> lower the RATIO
      #   peak near 0         -> the mic isn't hearing the user over the
      #                          speaker; barge-in won't work until that is
      #                          fixed (see the mic constraints in
      #                          luna-web sessionWebSocket.js)
      #
      # SETTLE_FRAMES (8 x 30 ms = ~240 ms) is dropped after the cut, covering
      # the round-trip until the client silences the speaker plus the echo
      # canceller re-converging. Raise this FIRST if barge-in transcripts still
      # come back garbled.
      VOICE_BARGE_IN_MODE: vad
      VOICE_BARGE_IN_WINDOW_FRAMES: 15
      VOICE_BARGE_IN_RATIO: 0.6
      VOICE_BARGE_IN_SETTLE_FRAMES: 8

      # ~800 ms of silence ends an utterance. 600 ms cut off anyone who paused
      # to think mid-sentence — they had to talk fast to be heard at all.
      VOICE_SPEECH_END_FRAMES: 27

      TTS_PROVIDER: cartesia
      # Comma-separated for failover: keys are used in order, and the next one
      # takes over when Cartesia reports the current key out of credits.
      CARTESIA_API_KEY: sk_car_rsMdvvtEFz4zvuvEmgqGdz, sk_car_LBvVBZyEYFfexyjJWmEHmp
      CARTESIA_VOICE_ID: b441c4fd-4910-4c55-ae56-f0291057e2cc

      # Speech / TTS
      WHISPER_MODEL: turbo

    volumes:
      # - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./storage:/app/storage
      - ai_cache:/root/.cache
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn src.drivers.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - fastapi

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_models:
    driver: local
  ai_cache:
    driver: local
  minio_data:
    driver: local

networks:
  fastapi:
    driver: bridge
