name: vsa
services:
  ollama:
    image: ollama/ollama:0.13.1-rc0
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - fastapi

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # environment:
    #   QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    networks:
      - fastapi

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - fastapi

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      # Application
      APP_NAME: ${APP_NAME:-VSA-BE-FastAPI-v2}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}

      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      KNOWLEDGE_COLLECTION_NAME: ${KNOWLEDGE_COLLECTION_NAME:-knowledge_collection}
      FACE_COLLECTION_NAME: ${FACE_COLLECTION_NAME:-faces_collection}

      # Ollama (config uses OLLAMA_BASE_URL)
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.1:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma:latest}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.4}
      OLLAMA_TOP_P: ${OLLAMA_TOP_P:-0.9}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-1024}

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-vsa-files}
      MINIO_SECURE: "false"

      # GPU (-1 CPU, 0+ GPU)
      GPU_DEVICE: ${GPU_DEVICE:--1}

      # Face Recognition (InsightFace)
      ENABLE_FACE_RECOGNITION: ${ENABLE_FACE_RECOGNITION:-true}
      FACE_RECOGNITION_MODEL: ${FACE_RECOGNITION_MODEL:-buffalo_sc}
      FACE_RECOGNITION_CTX_ID: ${FACE_RECOGNITION_CTX_ID:--1}
      FACE_DETECTION_SIZE: ${FACE_DETECTION_SIZE:-320}
      FACE_SIMILARITY_THRESHOLD: ${FACE_SIMILARITY_THRESHOLD:-0.5}

      # Speech / TTS
      WHISPER_MODEL: ${WHISPER_MODEL:-large}
      VOICE_CLONE_DIR: /app/storage/voice

    volumes:
      # - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./storage:/app/storage
      - ai_cache:/root/.cache
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn src.drivers.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - fastapi

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_models:
    driver: local
  ai_cache:
    driver: local
  minio_data:
    driver: local

networks:
  fastapi:
    driver: bridge
