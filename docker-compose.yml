name: luna
services:
  ollama:
    image: ollama/ollama:0.13.1-rc0
    container_name: ollama
    # ports:
    # - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - fastapi

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: luna_db
      POSTGRES_USER: bengkod
      POSTGRES_PASSWORD: luna_kece
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bengkod", "-d", "luna_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    container_name: qdrant
    ports:
      - "6333:6333"
      # - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    # environment:
    #   QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped
    networks:
      - fastapi

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - fastapi

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: fastapi
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_DB: luna_db
      POSTGRES_USER: bengkod
      POSTGRES_PASSWORD: luna_kece

      # Qdrant
      QDRANT_HOST: qdrant

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

      # GPU (-1 CPU, 0+ GPU)
      GPU_DEVICE: -1

      # Ollama / LLM — latency experiment: minimize gpt-oss thinking.
      # "low" | "medium" | "high"; unset/blank = model default. Revert by
      # removing this line (or setting it back to medium).
      OLLAMA_REASONING_EFFORT: low

      # Agent tools: rag_search (Udinus KB) + search_web (Exa, current/external info).
      EXA_API_KEY: "16aa6c02-58c2-4e8c-af32-01cb3157555b"
      WEB_SEARCH_COUNT: 3
      EXA_FETCH_TEXT: "false"             # false=highlights+bounded text (fast); true=full text
      # EXA_LIVECRAWL: fallback           # freshness vs latency (cached by default)
      # EXA_INCLUDE_DOMAINS: dinus.ac.id  # restrict to official (breaks general web)
      RAG_TOP_K: 3

      # Face Recognition (InsightFace)
      ENABLE_FACE_RECOGNITION: true
      ENABLE_EMOTION_DETECTION: true
      ENABLE_TTS: true
      FACE_RECOGNITION_CTX_ID: -1 # -1 CPU, 0+ GPU
      
      # Device-Directed Speech Detection (LR-ASD active-speaker fusion).
      # When false the directedness gate fails open on the audio-visual dimension
      # and degrades to a facing-only check. Needs the ONNX models at
      # storage/models/asd/ (audio_frontend / visual_frontend / av_backend).
      ENABLE_ASD: true
      # Tuning knobs — calibrate from the `directedness:` INFO log, not by guess.
      # FACING_THRESHOLD is provisional; see src/config.py for what the score means.
      FACING_THRESHOLD: 0.35
      ASD_SCORE_THRESHOLD: 0.5
      ASD_PRESENCE_RATIO: 0.35

      TTS_PROVIDER: cartesia
      CARTESIA_API_KEY: sk_car_gCFeyFRDSbpWtLBtuLj4ih
      CARTESIA_VOICE_ID: b441c4fd-4910-4c55-ae56-f0291057e2cc

      # Speech / TTS
      WHISPER_MODEL: large-v3

    volumes:
      # - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./storage:/app/storage
      - ai_cache:/root/.cache
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn src.drivers.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - fastapi

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_models:
    driver: local
  ai_cache:
    driver: local
  minio_data:
    driver: local

networks:
  fastapi:
    driver: bridge
