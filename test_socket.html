<!DOCTYPE html>
<html>
<body>
<div style="position: relative; display: inline-block;">
<video id="video" autoplay></video>
  <canvas id="overlay" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
</div>
<script>
  const ws = new WebSocket("ws://localhost:8000/v1/vision/stream");

  ws.onopen = () => console.log("WS connected");
  ws.onerror = (e) => console.error("WS error:", e);

  const video = document.getElementById("video");
  const overlay = document.getElementById("overlay");
  const overlayCtx = overlay.getContext("2d");

  function drawBoundingBoxes(results) {
    // Clear previous drawings
    overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
    
    if (!results || results.length === 0) {
      return;
    }

    results.forEach(result => {
      // Use 'bbox' instead of 'box' (matches backend)
      const bbox = result.bbox || result.box; // Support both for backward compatibility
      
      // Validate bbox exists and is an array with 4 elements
      if (!bbox || !Array.isArray(bbox) || bbox.length !== 4) {
        console.warn("Invalid bbox:", bbox, "in result:", result);
        return;
      }
      
      const name = result.name || "Unknown";
      const emotion = result.emotion || "neutral";
      const confidence = result.confidence || {};
      
      // Draw bounding box
      overlayCtx.strokeStyle = "#00ff00";
      overlayCtx.lineWidth = 2;
      overlayCtx.strokeRect(bbox[0], bbox[1], bbox[2], bbox[3]);
      
      // Draw label background
      const labelText = `${name} (${emotion})`;
      overlayCtx.font = "14px Arial";
      const textMetrics = overlayCtx.measureText(labelText);
      const labelHeight = 20;
      const labelY = bbox[1] - labelHeight;
      
      overlayCtx.fillStyle = "rgba(0, 255, 0, 0.7)";
      overlayCtx.fillRect(bbox[0], labelY, textMetrics.width + 10, labelHeight);
      
      // Draw label text
      overlayCtx.fillStyle = "#000000";
      overlayCtx.fillText(labelText, bbox[0] + 5, bbox[1] - 5);
    });
  }

  ws.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      
      if (data.event === "vision_update" && data.payload && data.payload.results) {
        // Print only the payload
        console.log("WS payload:", data.payload);
        
        // Update overlay canvas size to match video
        overlay.width = video.videoWidth;
        overlay.height = video.videoHeight;
        
        // Draw bounding boxes
        drawBoundingBoxes(data.payload.results);
      }
    } catch (err) {
      console.error("Error parsing message:", err);
    }
  };

  navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
    video.srcObject = stream;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    setInterval(() => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      canvas.toBlob(blob => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(",")[1]; // ambil bagian base64-nya saja
          ws.send(JSON.stringify({ event: "webcam_frame", data: base64 }));
        };
        reader.readAsDataURL(blob);
      }, "image/jpeg", 0.8);
    }, 100); // kirim 1 frame per detik
  });
</script>
</body>
</html>
