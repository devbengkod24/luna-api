<!DOCTYPE html>
<html>
<body>
<video id="video" autoplay></video>
<script>
  const ws = new WebSocket("ws://localhost:8000/v1/vision/stream");

  ws.onopen = () => console.log("WS connected");
  ws.onmessage = (e) => console.log("WS message:", e.data);
  ws.onerror = (e) => console.error("WS error:", e);

  navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
    const video = document.getElementById("video");
    video.srcObject = stream;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    setInterval(() => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      canvas.toBlob(blob => {
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(",")[1]; // ambil bagian base64-nya saja
          ws.send(JSON.stringify({ event: "webcam_frame", data: base64 }));
        };
        reader.readAsDataURL(blob);
      }, "image/jpeg", 0.8);
    }, 1000); // kirim 1 frame per detik
  });
</script>
</body>
</html>
